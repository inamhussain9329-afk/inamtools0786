<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Formatter & Validator - Pretty Print, Minify & Validate Online | InamTools</title>
<meta name="description" content="Free premium JSON Formatter & Validator by InamTools. Pretty print, minify, and validate JSON instantly with line numbers and clear error messages — all in your browser.">
<meta name="keywords" content="json formatter, json validator, json pretty print, minify json, json beautifier, InamTools">
<meta name="author" content="InamTools">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://inamtools.com/json-formatter">

<meta property="og:type" content="website">
<meta property="og:title" content="JSON Formatter & Validator | InamTools">
<meta property="og:description" content="Pretty print, minify, and validate JSON instantly with line numbers and clear error messages. Free, fast, and private — powered by InamTools.">
<meta property="og:site_name" content="InamTools">
<meta property="og:url" content="https://inamtools.com/json-formatter">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="JSON Formatter & Validator | InamTools">
<meta name="twitter:description" content="Format, minify, and validate JSON instantly — free, live, and private.">

<meta name="theme-color" content="#0a0c12">
<style>
  :root{
    --bg:#0a0c12;
    --panel:#12151f;
    --panel-2:#171b28;
    --border:#242938;
    --border-soft:#1c2130;
    --text:#eef0f8;
    --muted:#8b93a9;
    --accent:#7c5cff;
    --accent-2:#38e0d8;
    --accent-3:#ff8a5c;
    --danger:#ff5c7a;
    --good:#3ce68a;
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(124,92,255,0.20), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(56,224,216,0.14), transparent 55%),
      radial-gradient(800px 400px at 50% 100%, rgba(255,138,92,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
    animation:fadeIn .5s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .wrap{width:100%;max-width:820px;}

  .card{
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:clamp(20px, 5vw, 36px);
    box-shadow: 0 24px 70px rgba(0,0,0,0.5);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
  }
  .brand .logo{
    width:36px;height:36px;border-radius:11px;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:16px;color:#0a0c12;
    box-shadow:0 6px 16px rgba(124,92,255,0.35);
  }
  .brand span{
    font-weight:700;
    letter-spacing:0.3px;
    color:var(--text);
    font-size:15px;
  }
  h1{
    font-size:clamp(20px,4.5vw,25px);
    font-weight:800;
    margin:20px 0 4px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  p.subtitle{
    color:var(--muted);
    font-size:14px;
    margin-bottom:20px;
    line-height:1.5;
  }

  /* Toolbar */
  .toolbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .tbtn{
    background:#0d0f17;
    border:1px solid var(--border);
    color:var(--text);
    font-size:13px;
    font-weight:700;
    padding:10px 15px;
    border-radius:11px;
    cursor:pointer;
    transition:border-color .2s, background .2s, transform .15s;
    font-family:inherit;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .tbtn:active{transform:scale(0.96);}
  .tbtn:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;}
  .tbtn:hover{border-color:var(--accent);}
  .tbtn.primary{
    background:linear-gradient(135deg, var(--accent), #a06bff);
    border-color:transparent;
    box-shadow:0 6px 16px rgba(124,92,255,0.3);
  }
  .tbtn.primary:hover{box-shadow:0 8px 22px rgba(124,92,255,0.45);}

  /* Editor */
  .editor-shell{
    display:flex;
    background:#0d0f17;
    border:1px solid var(--border-soft);
    border-radius:14px;
    overflow:hidden;
    transition:border-color .2s;
    height:340px;
  }
  .editor-shell.invalid{border-color:var(--danger);box-shadow:0 0 0 3px rgba(255,92,122,0.15);}
  .editor-shell.valid{border-color:var(--good);box-shadow:0 0 0 3px rgba(60,230,138,0.12);}

  .line-numbers{
    flex:0 0 auto;
    width:44px;
    background:#0a0c12;
    color:var(--muted);
    font-family:'Consolas','Monaco',monospace;
    font-size:12.5px;
    line-height:20px;
    text-align:right;
    padding:14px 8px 14px 0;
    overflow:hidden;
    user-select:none;
    border-right:1px solid var(--border-soft);
    white-space:pre;
  }
  #jsonInput{
    flex:1;
    min-width:0;
    background:transparent;
    border:none;
    outline:none;
    resize:none;
    color:var(--text);
    font-family:'Consolas','Monaco',monospace;
    font-size:12.5px;
    line-height:20px;
    padding:14px 16px;
    white-space:pre;
    overflow:auto;
    tab-size:2;
  }
  #jsonInput::placeholder{color:#3a3f52;}

  /* Status bar */
  .status-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
    font-size:12px;
    color:var(--muted);
  }
  .status-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-weight:700;
    padding:6px 12px;
    border-radius:999px;
    font-size:12px;
  }
  .status-badge.valid{background:rgba(60,230,138,0.12);color:var(--good);}
  .status-badge.invalid{background:rgba(255,92,122,0.12);color:var(--danger);}
  .status-badge.neutral{background:rgba(139,147,169,0.12);color:var(--muted);}
  .meta-counts{display:flex;gap:14px;flex-wrap:wrap;}

  .error-box{
    margin-top:12px;
    background:rgba(255,92,122,0.08);
    border:1px solid rgba(255,92,122,0.35);
    color:#ffb3c0;
    padding:12px 14px;
    border-radius:12px;
    font-size:13px;
    display:none;
    align-items:flex-start;
    gap:8px;
    line-height:1.5;
  }
  .error-box.show{display:flex;}
  .error-box strong{color:#ffd7de;}

  .btn-row{
    display:flex;
    gap:12px;
    margin-top:20px;
    flex-wrap:wrap;
  }
  button.action{
    border:none;
    cursor:pointer;
    font-size:14px;
    font-weight:700;
    padding:14px 20px;
    border-radius:13px;
    transition:transform .15s ease, opacity .15s, box-shadow .2s, border-color .2s;
    font-family:inherit;
  }
  button.action:active{transform:scale(0.96);}
  button.action:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;}
  .btn-primary{
    background:linear-gradient(135deg, var(--accent), #a06bff);
    color:#fff;
    flex:1;
    box-shadow:0 10px 24px rgba(124,92,255,0.35);
  }
  .btn-primary:hover{box-shadow:0 12px 30px rgba(124,92,255,0.5);}
  .btn-secondary{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--border);
  }
  .btn-secondary:hover{
    color:var(--text);
    border-color:#3a3f52;
  }

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);
    border:1px solid var(--accent);
    color:var(--text);
    padding:13px 22px;
    border-radius:11px;
    font-size:14px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s, transform .25s;
    box-shadow:0 12px 34px rgba(0,0,0,0.45);
    z-index:100;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  footer{
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
    margin-top:26px;
    padding-top:18px;
    border-top:1px solid var(--border-soft);
  }
  footer strong{color:var(--text);}
  footer .tagline{
    display:block;
    margin-top:4px;
    font-size:11.5px;
    opacity:0.75;
  }

  @media (max-width:480px){
    .editor-shell{height:280px;}
    .tbtn{font-size:12px;padding:9px 12px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <div class="brand">
      <div class="logo" aria-hidden="true">IT</div>
      <span>InamTools</span>
    </div>
    <h1><span aria-hidden="true">{ }</span> JSON Formatter & Validator</h1>
    <p class="subtitle">Paste your JSON below to pretty print, minify, and validate it instantly with clear error messages.</p>

    <div class="toolbar" role="toolbar" aria-label="JSON actions">
      <button type="button" class="tbtn primary" id="formatBtn">✨ Format</button>
      <button type="button" class="tbtn" id="minifyBtn">📦 Minify</button>
      <button type="button" class="tbtn" id="validateBtn">✅ Validate</button>
      <button type="button" class="tbtn" id="sampleBtn">📝 Sample JSON</button>
    </div>

    <div class="editor-shell" id="editorShell">
      <div class="line-numbers" id="lineNumbers" aria-hidden="true">1</div>
      <textarea id="jsonInput" placeholder='Paste your JSON here, e.g. { "name": "InamTools", "type": "toolkit" }' spellcheck="false" aria-label="JSON input editor"></textarea>
    </div>

    <div class="error-box" id="errorBox" role="alert">
      <span aria-hidden="true">⚠️</span>
      <span id="errorText"></span>
    </div>

    <div class="status-bar">
      <span class="status-badge neutral" id="statusBadge">◌ Not validated</span>
      <div class="meta-counts">
        <span id="lineCount">Lines: 0</span>
        <span id="charCount">Characters: 0</span>
      </div>
    </div>

    <div class="btn-row">
      <button type="button" class="action btn-primary" id="copyBtn">📋 Copy JSON</button>
      <button type="button" class="action btn-secondary" id="downloadBtn">⬇️ Download</button>
      <button type="button" class="action btn-secondary" id="clearBtn">Clear</button>
    </div>

    <footer>
      Made by <strong>InamTools</strong>
      <span class="tagline">Free online tools — fast, private, and premium.</span>
    </footer>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  const jsonInput = document.getElementById('jsonInput');
  const lineNumbers = document.getElementById('lineNumbers');
  const editorShell = document.getElementById('editorShell');
  const errorBox = document.getElementById('errorBox');
  const errorText = document.getElementById('errorText');
  const statusBadge = document.getElementById('statusBadge');
  const lineCount = document.getElementById('lineCount');
  const charCount = document.getElementById('charCount');
  const toast = document.getElementById('toast');

  const formatBtn = document.getElementById('formatBtn');
  const minifyBtn = document.getElementById('minifyBtn');
  const validateBtn = document.getElementById('validateBtn');
  const sampleBtn = document.getElementById('sampleBtn');
  const copyBtn = document.getElementById('copyBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const clearBtn = document.getElementById('clearBtn');

  const SAMPLE_JSON = {
    name: "InamTools",
    type: "Toolkit",
    version: 1.0,
    isFree: true,
    tools: ["Age Calculator", "BMI Calculator", "Unit Converter", "Image Resizer"],
    contact: {
      website: "https://inamtools.com",
      email: "support@inamtools.com"
    },
    rating: 4.9,
    tags: null
  };

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 2000);
  }

  function updateLineNumbers(){
    const lines = jsonInput.value.split('\n').length;
    let out = '';
    for(let i=1;i<=lines;i++){ out += i + '\n'; }
    lineNumbers.textContent = out;
  }

  function syncScroll(){
    lineNumbers.scrollTop = jsonInput.scrollTop;
  }

  function updateCounts(){
    const val = jsonInput.value;
    const lines = val === '' ? 0 : val.split('\n').length;
    lineCount.textContent = 'Lines: ' + lines;
    charCount.textContent = 'Characters: ' + val.length;
  }

  function getLineCol(text, pos){
    const upto = text.slice(0, pos);
    const lines = upto.split('\n');
    const line = lines.length;
    const col = lines[lines.length - 1].length + 1;
    return {line, col};
  }

  function parseErrorMessage(err, text){
    let message = err.message || 'Invalid JSON';
    // Try to find an explicit line/column already in the message (modern engines)
    const lineColMatch = message.match(/line (\d+) column (\d+)/i);
    if(lineColMatch){
      return { line: lineColMatch[1], col: lineColMatch[2], message: message };
    }
    // Fallback: find position and compute line/col manually
    const posMatch = message.match(/position (\d+)/i);
    if(posMatch){
      const pos = parseInt(posMatch[1], 10);
      const {line, col} = getLineCol(text, pos);
      return { line, col, message: message };
    }
    return { line: '?', col: '?', message: message };
  }

  function setValidState(isValid, errInfo){
    editorShell.classList.remove('valid','invalid');
    if(jsonInput.value.trim() === ''){
      statusBadge.className = 'status-badge neutral';
      statusBadge.textContent = '◌ Not validated';
      errorBox.classList.remove('show');
      return;
    }
    if(isValid){
      editorShell.classList.add('valid');
      statusBadge.className = 'status-badge valid';
      statusBadge.textContent = '✅ Valid JSON';
      errorBox.classList.remove('show');
    } else {
      editorShell.classList.add('invalid');
      statusBadge.className = 'status-badge invalid';
      statusBadge.textContent = '❌ Invalid JSON';
      errorText.innerHTML = `<strong>Line ${errInfo.line}, Column ${errInfo.col}:</strong> ${errInfo.message}`;
      errorBox.classList.add('show');
    }
  }

  function tryParse(){
    const text = jsonInput.value;
    if(text.trim() === ''){
      setValidState(true);
      return { ok:false, empty:true };
    }
    try{
      const data = JSON.parse(text);
      setValidState(true);
      return { ok:true, data };
    }catch(err){
      const errInfo = parseErrorMessage(err, text);
      setValidState(false, errInfo);
      return { ok:false, empty:false };
    }
  }

  function formatJson(){
    const result = tryParse();
    if(result.empty){
      showToast('Please paste some JSON first');
      return;
    }
    if(!result.ok){
      showToast('Cannot format — fix the JSON error first');
      return;
    }
    jsonInput.value = JSON.stringify(result.data, null, 2);
    updateLineNumbers();
    updateCounts();
    showToast('✨ JSON formatted');
  }

  function minifyJson(){
    const result = tryParse();
    if(result.empty){
      showToast('Please paste some JSON first');
      return;
    }
    if(!result.ok){
      showToast('Cannot minify — fix the JSON error first');
      return;
    }
    jsonInput.value = JSON.stringify(result.data);
    updateLineNumbers();
    updateCounts();
    showToast('📦 JSON minified');
  }

  function validateJson(){
    const result = tryParse();
    if(result.empty){
      showToast('Please paste some JSON first');
      return;
    }
    showToast(result.ok ? '✅ Valid JSON' : '❌ Invalid JSON — see details below');
  }

  function loadSample(){
    jsonInput.value = JSON.stringify(SAMPLE_JSON, null, 2);
    updateLineNumbers();
    updateCounts();
    tryParse();
    showToast('📝 Sample JSON loaded');
  }

  async function copyJson(){
    if(jsonInput.value.trim() === ''){
      showToast('Nothing to copy');
      return;
    }
    try{
      await navigator.clipboard.writeText(jsonInput.value);
      showToast('✅ Copied to clipboard!');
    }catch(err){
      jsonInput.select();
      try{ document.execCommand('copy'); showToast('✅ Copied to clipboard!'); }
      catch(e){ showToast('Copy failed'); }
    }
  }

  function downloadJson(){
    if(jsonInput.value.trim() === ''){
      showToast('Nothing to download');
      return;
    }
    const blob = new Blob([jsonInput.value], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'inamtools-data.json';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    showToast('⬇️ JSON file downloaded');
  }

  function clearAll(){
    jsonInput.value = '';
    updateLineNumbers();
    updateCounts();
    setValidState(true);
    errorBox.classList.remove('show');
    jsonInput.focus();
  }

  let debounceTimer = null;
  jsonInput.addEventListener('input', ()=>{
    updateLineNumbers();
    updateCounts();
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(tryParse, 350);
  });
  jsonInput.addEventListener('scroll', syncScroll);

  // Tab key inserts spaces instead of moving focus
  jsonInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Tab'){
      e.preventDefault();
      const start = jsonInput.selectionStart;
      const end = jsonInput.selectionEnd;
      jsonInput.value = jsonInput.value.slice(0, start) + '  ' + jsonInput.value.slice(end);
      jsonInput.selectionStart = jsonInput.selectionEnd = start + 2;
      updateLineNumbers();
      updateCounts();
    }
  });

  formatBtn.addEventListener('click', formatJson);
  minifyBtn.addEventListener('click', minifyJson);
  validateBtn.addEventListener('click', validateJson);
  sampleBtn.addEventListener('click', loadSample);
  copyBtn.addEventListener('click', copyJson);
  downloadBtn.addEventListener('click', downloadJson);
  clearBtn.addEventListener('click', clearAll);

  // Init
  updateLineNumbers();
  updateCounts();
})();
</script>

</body>
</html>
